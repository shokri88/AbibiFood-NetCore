name: sql-integration-acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start isolated SQL Server with a disposable generated password
        shell: bash
        run: |
          set -euo pipefail
          sql_password="Abibi1!$(openssl rand -hex 24)"
          echo "::add-mask::$sql_password"
          docker run --detach --name abibi-ci-sql \
            --publish 127.0.0.1:14333:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$sql_password" \
            mcr.microsoft.com/mssql/server:2022-latest
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec --env SQLCMDPASSWORD="$sql_password" abibi-ci-sql \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs abibi-ci-sql
            exit 1
          fi
          printf '%s\n' "ABIBI_TEST_SQL=Server=127.0.0.1,14333;Initial Catalog=master;User ID=sa;Password=$sql_password;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
          printf '%s\n' 'ABIBI_REQUIRE_SQL=true' >> "$GITHUB_ENV"
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -m:1 -p:BuildInParallel=false
      - name: Run HTTP, business and actual SQL acceptance tests
        run: dotnet test --no-build --no-restore --logger "trx;LogFileName=backend.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
      - name: Remove disposable SQL container
        if: always()
        run: docker rm --force abibi-ci-sql || true
